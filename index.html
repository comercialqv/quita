<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://dvpuyudsemvjtzfjlfsm.supabase.co wss://dvpuyudsemvjtzfjlfsm.supabase.co https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08090A">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quita</title>
<!--FONTES--><link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet"><!--/FONTES-->
<style>
/* ============================== tokens ============================== */
:root,[data-theme="escuro"]{
  --canvas:#08090A;--shell:#0C0E11;--surface:#111317;--surface-2:#171A1F;
  --border:#1E2127;--border-strong:#2A2E36;
  --text-1:#EDEEF0;--text-2:#A0A6B0;--text-3:#7A808B;
  --accent-fill:#3563E9;--accent-fill-h:#4472F2;--accent-fg:#7097FF;--accent-wash:rgba(53,99,233,.14);--on-accent:#FFFFFF;
  --ok:#34C17B;--warn:#F0A23B;--risk:#F2555A;
  --ok-wash:rgba(52,193,123,.12);--warn-wash:rgba(240,162,59,.12);--risk-wash:rgba(242,85,90,.12);--neutral-wash:rgba(160,166,176,.10);
  --hover:rgba(255,255,255,.035);--pressed:rgba(255,255,255,.06);
  --shadow-pop:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
[data-theme="claro"]{
  --canvas:#F6F7F8;--shell:#EDEFF2;--surface:#FFFFFF;--surface-2:#F9FAFB;
  --border:#E3E6EA;--border-strong:#D2D6DC;
  --text-1:#0D0F12;--text-2:#4A505A;--text-3:#6B717C;
  --accent-fill:#2F5BDB;--accent-fill-h:#2550C8;--accent-fg:#2F5BDB;--accent-wash:rgba(47,91,219,.10);--on-accent:#FFFFFF;
  --ok:#1E9E5E;--warn:#B86E00;--risk:#D33A3F;
  --ok-wash:rgba(30,158,94,.10);--warn-wash:rgba(184,110,0,.10);--risk-wash:rgba(211,58,63,.09);--neutral-wash:rgba(74,80,90,.07);
  --hover:rgba(13,15,18,.035);--pressed:rgba(13,15,18,.06);
  --shadow-pop:0 12px 32px rgba(13,15,18,.14);
  color-scheme:light;
}
:root{
  --f-display:"Mona Sans","Mona Sans Variable",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Geist","Geist Variable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono","Geist Mono Variable",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-12:.75rem;--t-13:.8125rem;--t-14:.875rem;--t-16:1rem;--t-20:1.25rem;
  --d-28:1.75rem;--d-32:2rem;--d-44:2.75rem;--d-56:3.5rem;
  --r-ctl:6px;--r-pan:10px;--r-pill:999px;
  --row:40px;--side:232px;
  --ease-out:cubic-bezier(.16,1,.3,1);
}

/* ============================== base ============================== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas)}
body{font-family:var(--f-ui);font-size:var(--t-14);line-height:1.45;color:var(--text-1);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:var(--t-12);letter-spacing:0}
.t2{color:var(--text-2)}.t3{color:var(--text-3)}
a{color:var(--accent-fg);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================== casca ============================== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.app.recolhida{--side:56px}
.lateral{background:var(--shell);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow:hidden}
.marca{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px;margin-bottom:10px}
.marca .sel{width:22px;height:22px;border-radius:6px;background:var(--text-1);color:var(--canvas);display:grid;place-items:center;font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:14px;flex:none}
.marca b{font-family:var(--f-display);font-stretch:80%;font-weight:620;font-size:var(--t-16);letter-spacing:-.01em}
.marca .rec{margin-left:auto}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-ctl);color:var(--text-2);border:0;background:none;width:100%;text-align:left;cursor:pointer;white-space:nowrap;font-size:var(--t-14)}
.nav:hover{background:var(--hover);color:var(--text-1)}
.nav[aria-current="page"]{background:var(--surface-2);color:var(--text-1);box-shadow:inset 0 0 0 1px var(--border)}
.nav .qtd{margin-left:auto;font-size:var(--t-12);color:var(--warn);font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--border);margin:8px 4px}
.lateral .pe{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.escritorio{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);margin-top:6px;cursor:pointer;color:var(--text-1);text-align:left;width:100%}
.escritorio .av{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2);flex:none}
.escritorio small{display:block;color:var(--text-3);font-size:var(--t-12)}
.app.recolhida .nav span,.app.recolhida .nav .qtd,.app.recolhida .marca b,.app.recolhida .escritorio div,.app.recolhida .escritorio .i{display:none}
.app.recolhida .nav{justify-content:center;padding:0}
@media (max-width:1023px) and (min-width:761px){
  .app{--side:56px}
  .app .nav span,.app .nav .qtd,.app .marca b,.app .marca .rec,.app .escritorio div,.app .escritorio .i{display:none}
  .app .nav{justify-content:center;padding:0}
}

.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:10px;padding:0 24px}
.busca{display:flex;align-items:center;gap:8px;height:32px;min-width:280px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-3);cursor:text}
.busca kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--text-3);border:1px solid var(--border-strong);border-radius:4px;padding:0 5px}
.chip-rodada{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--border);color:var(--text-2);font-size:var(--t-13);white-space:nowrap}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.ponto.warn{background:var(--warn)}.ponto.risk{background:var(--risk)}
.ponto.vivo{animation:pulso 1.4s var(--ease-out) infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent-fg) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:8px}

.faixa{display:flex;align-items:center;gap:10px;padding:9px 24px;border-bottom:1px solid var(--border);font-size:var(--t-13);color:var(--text-1);background:var(--warn-wash)}
.faixa.risk{background:var(--risk-wash)}
.faixa .i{color:var(--warn)}.faixa.risk .i{color:var(--risk)}
.faixa .acoes{margin-left:auto;display:flex;gap:6px;align-items:center}

.conteudo{padding:32px 32px 120px;max-width:1360px;width:100%}

/* ============================== controles ============================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-1);font-size:var(--t-13);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .1s var(--ease-out)}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--text-1) 6%);border-color:color-mix(in srgb,var(--border-strong) 70%,var(--text-3))}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent-fill);border-color:transparent;color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-fill-h)}
.btn.fan{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.fan:hover{background:var(--hover);color:var(--text-1)}
.btn.perigo{color:var(--risk)}
.btn.p{height:28px;padding:0 10px;font-size:var(--t-12)}
.btn.ico{width:32px;padding:0}.btn.p.ico{width:28px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.carregando{pointer-events:none;color:transparent;position:relative}
.btn.carregando::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--text-2);border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
.btn.pri.carregando::after{border-color:var(--on-accent);border-right-color:transparent}
.btn.erro{border-color:var(--risk);color:var(--risk)}
@keyframes gira{to{transform:rotate(360deg)}}
.selo{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--t-12);font-weight:500;white-space:nowrap}
.selo .i{width:13px;height:13px}
.selo.ok{background:var(--ok-wash);color:var(--ok)}.selo.warn{background:var(--warn-wash);color:var(--warn)}.selo.risk{background:var(--risk-wash);color:var(--risk)}.selo.neu{background:var(--neutral-wash);color:var(--text-2)}.selo.acc{background:var(--accent-wash);color:var(--accent-fg)}
.cb{appearance:none;width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin:0;flex:none}
.cb:checked{background:var(--accent-fill);border-color:var(--accent-fill)}
.cb:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pnl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pan)}
.esq{background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 60%,var(--border-strong)),var(--surface-2));background-size:200% 100%;animation:brilho 1.3s linear infinite;border-radius:4px}
@keyframes brilho{to{background-position:-200% 0}}

/* ============================== Hoje ============================== */
.manchete{font-family:var(--f-display);font-stretch:75%;font-weight:600;font-size:var(--d-56);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.manchete .t3{color:var(--text-3);display:block}
.sub{margin:10px 0 0;color:var(--text-2);font-size:var(--t-14)}
.regua-mes{margin:28px 0 32px;position:relative}
.regua-mes .dias{display:grid;gap:3px;height:28px;align-items:end}
.regua-mes .d{height:20px;border-radius:2px;background:var(--border-strong);position:relative;transform-origin:bottom}
.regua-mes .d{background:var(--border)}
.regua-mes .d.passado{background:var(--text-3)}
.regua-mes .d.hoje{height:28px;background:var(--accent-fg)}
.regua-mes .d.limite{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn);height:28px}
.regua-mes.animar .d{animation:sobe .4s var(--ease-out) both}
@keyframes sobe{from{transform:scaleY(.15);opacity:.3}}
.regua-mes .eixo{display:flex;justify-content:space-between;margin-top:8px;font-size:var(--t-12);color:var(--text-3)}
.regua-mes .marcas{position:relative;height:16px;margin-top:6px;font-size:var(--t-12)}
.regua-mes .marcas span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.progresso{display:flex;align-items:center;gap:12px;margin-top:14px}
.progresso .barra{flex:1;height:4px;border-radius:2px;background:var(--border-strong);overflow:hidden;max-width:420px}
.progresso .barra i{display:block;height:100%;background:var(--ok);border-radius:2px}

.hoje-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.fila .cab{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.fila .cab h2,.lado h2{font-size:var(--t-14);font-weight:600;margin:0}
.grupo-t{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:var(--t-12);color:var(--text-3);font-weight:500}
.grupo-t .i{width:14px;height:14px}
.grupo-t.risk{color:var(--risk)}.grupo-t.warn{color:var(--warn)}
.lin{display:grid;grid-template-columns:20px minmax(0,1fr) 96px 56px 176px;align-items:center;gap:12px;min-height:var(--row);padding:8px 16px;border-top:1px solid var(--border);position:relative}
.lin:hover{background:var(--hover)}
.lin.sel{background:var(--accent-wash)}
.lin.piscar{animation:pisca .6s var(--ease-out)}
@keyframes pisca{from{background:var(--accent-wash)}}
.lin .cli{min-width:0}
.lin .cli b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin .mot{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--text-2);font-size:var(--t-13);overflow:hidden;margin-top:1px}
.lin.cabec{min-height:0;padding-top:8px;padding-bottom:8px;font-size:var(--t-12);color:var(--text-3);background:var(--surface-2)}
.lin.cabec:hover{background:var(--surface-2)}
.lin.cabec .val,.lin.cabec .prz{color:var(--text-3);font-size:var(--t-12)}
.lin .val{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--t-13)}
.lin .prz{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--t-13);color:var(--text-2)}
.lin .prz.urg{color:var(--warn)}
.lin .ac{justify-self:end}
.lin .ac .btn{min-width:0}
.lote{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 32px));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:var(--r-pan);background:var(--surface-2);border:1px solid var(--border-strong);box-shadow:var(--shadow-pop);z-index:20;transition:transform .22s var(--ease-out);font-size:var(--t-13)}
.lote{visibility:hidden}.lote.on{transform:translate(-50%,0);visibility:visible}

.lado{display:flex;flex-direction:column;gap:20px}
.lado .pnl{padding:14px 16px}
.lado .cab{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.etapas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.etapas li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:var(--t-13)}
.etapas li + li{border-top:1px dashed var(--border)}
.etapas .st{width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.etapas .st.ok{color:var(--ok)}.etapas .st.vivo{color:var(--accent-fg)}.etapas .st.esp{color:var(--text-3)}.etapas .st.err{color:var(--risk)}
.etapas .st .i{width:14px;height:14px}
.etapas .n{font-variant-numeric:tabular-nums;color:var(--text-2)}
.etapas .mini{grid-column:2/4;height:3px;border-radius:2px;background:var(--border-strong);overflow:hidden;margin-top:-2px}
.etapas .mini i{display:block;height:100%;background:var(--accent-fg)}
.lado .rod{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:var(--t-12);color:var(--text-2);white-space:nowrap}
.lado .rod .prox{min-width:0;overflow:hidden;text-overflow:ellipsis}
.confirma-linha{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px;border-radius:var(--r-ctl);background:var(--surface-2);border:1px solid var(--border-strong);font-size:var(--t-13)}
.mes-lista{display:flex;flex-direction:column}
.mes-lista .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--border)}
.mes-lista .it:first-child{border-top:0;padding-top:0}
.mes-lista .it b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.mes-lista .it small{grid-column:1/3;color:var(--text-3);font-size:var(--t-12)}
.dif.up{color:var(--ok)}.dif.down{color:var(--warn)}

.vazio{padding:36px 16px;text-align:center;color:var(--text-2)}
.vazio b{display:block;color:var(--text-1);font-weight:600;margin-bottom:4px}

/* paleta de comandos */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
[data-theme="claro"] .veu{background:rgba(13,15,18,.22)}
.veu.on{display:flex}
.paleta{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-pan);box-shadow:var(--shadow-pop);overflow:hidden;animation:entra .2s var(--ease-out)}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}}
.paleta input{width:100%;height:48px;border:0;border-bottom:1px solid var(--border);background:transparent;padding:0 16px;font-size:var(--t-16);outline:none}
.paleta .res{max-height:320px;overflow:auto;padding:6px}
.paleta .op{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-ctl);cursor:pointer}
.paleta .op[aria-selected="true"],.paleta .op:hover{background:var(--surface-2)}
.paleta .op .mono{margin-left:auto;color:var(--text-3)}

/* seletor de demonstração */
.demo{position:fixed;left:calc(var(--side) + 12px);bottom:12px;z-index:50;display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-ctl);font-size:var(--t-12)}
.demo button{border:0;background:none;color:var(--text-2);padding:4px 8px;border-radius:4px;cursor:pointer}
.demo button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-fg)}
.toast{position:fixed;right:20px;bottom:64px;z-index:45;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-ctl);padding:10px 14px;font-size:var(--t-13);box-shadow:var(--shadow-pop);animation:entra .2s var(--ease-out)}

.barra-inferior{display:none}
@media (max-width:1040px){
  .hoje-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .lateral{display:none}
  .topo{padding:0 14px;gap:8px}
  .busca{min-width:0;flex:0 0 32px;width:32px;padding:0;justify-content:center}.busca span,.busca kbd{display:none}
  .chip-rodada .txt{display:none}
  .faixa{padding:9px 14px}
  .conteudo{padding:20px 14px 110px}
  .manchete{font-size:var(--d-28)}
  .regua-mes{margin:18px 0 22px}.regua-mes .dias{gap:2px}
  .lin{grid-template-columns:20px minmax(0,1fr);grid-template-areas:"cb cli" ". ac";row-gap:8px;padding:12px 14px}
  .lin .cbx{grid-area:cb;align-self:start;margin-top:2px}.lin .cli{grid-area:cli}.lin .ac{grid-area:ac;justify-self:start}
  .lin .mot{white-space:normal}
  .topo .btn.pri .longo{display:none}
  .faixa{display:grid;grid-template-columns:16px 1fr;align-items:start}.faixa .i{margin-top:2px}.faixa .acoes{grid-column:2;margin-left:0}
  .lin.cabec{display:none}
  .lado .rod{flex-wrap:wrap}
  .lin .val,.lin .prz{display:none}
  .lin .mot .mob{display:inline}
  .barra-inferior{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--shell);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .barra-inferior button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--text-3);font-size:11px;padding:4px 0;cursor:pointer}
  .barra-inferior button[aria-current="page"]{color:var(--text-1)}

.mob{display:none}
.curto{display:none}
@media (max-width:760px){.topo .btn.pri .curto{display:inline}}
html,body{overflow-x:hidden}

/* ============================== Parcelamentos ============================== */
.cab-tela{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.titulo{font-family:var(--f-display);font-stretch:75%;font-weight:600;font-size:var(--d-44);line-height:1.02;letter-spacing:-.02em;margin:0}
.resumo{color:var(--text-2);margin:8px 0 0;font-size:var(--t-14)}
.resumo b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;color:var(--text-2);font-size:var(--t-13);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-1);box-shadow:inset 0 0 0 1px var(--border-strong)}
.seg .n{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:var(--t-12)}
.seg button[aria-pressed="true"] .n{color:var(--text-2)}
.campo{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-3)}
.campo input,.campo select{border:0;background:transparent;outline:none;color:var(--text-1);font-size:var(--t-13);height:30px;min-width:0}
.campo select{padding-right:4px;cursor:pointer}
.campo select option{background:var(--surface);color:var(--text-1)}
.campo:focus-within{border-color:var(--accent-fg)}
.filtros .campo.busca-l{margin-left:auto;width:260px}.filtros .campo.busca-l input{width:100%}
.tab{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--t-13)}
.tab thead th{position:sticky;top:56px;z-index:2;background:var(--surface-2);color:var(--text-3);font-weight:500;font-size:var(--t-12);text-align:left;padding:0 12px;height:34px;border-bottom:1px solid var(--border);white-space:nowrap}
.tab thead th:first-child{border-top-left-radius:var(--r-pan)}.tab thead th:last-child{border-top-right-radius:var(--r-pan)}
.tab th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tab th button:hover{color:var(--text-1)}
.tab th button .i{width:12px;height:12px;opacity:.6}
.tab th[aria-sort] button{color:var(--text-1)}
.tab td{padding:0 12px;height:44px;border-bottom:1px solid var(--border);vertical-align:middle}
.tab tbody tr{cursor:pointer}
.tab tbody tr:hover td{background:var(--hover)}
.tab tbody tr[aria-selected="true"] td{background:var(--accent-wash)}
.tab tbody tr:last-child td{border-bottom:0}
.tab .cli b{display:block;font-weight:500;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .cli .mono{color:var(--text-3)}
.tab .mono{white-space:nowrap}
.tab .dir{text-align:right}
.tab .mod1{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pan)}
.rodape-tab{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--border);color:var(--text-3);font-size:var(--t-12)}
/* régua de parcelas: 3×14, gap 2 */
.regua{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.regua i{width:3px;height:14px;border-radius:1px;background:var(--border-strong)}
.regua i.env{background:var(--text-3)}
.regua i.base{background:color-mix(in srgb,var(--text-3) 55%,transparent)}
.regua i.atual{background:transparent;box-shadow:inset 0 0 0 1px var(--accent-fg)}
.regua i.atual.env{background:var(--accent-fg);box-shadow:none}
.regua i.prob{background:var(--risk)}
.paga{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);white-space:nowrap}
.paga .i{width:14px;height:14px;color:var(--text-3)}
/* gaveta */
.gaveta-veu{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s}
[data-theme="claro"] .gaveta-veu{background:rgba(13,15,18,.12)}
.gaveta-veu.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:36;background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-pop);transform:translateX(100%);transition:transform .16s ease-out;display:flex;flex-direction:column}
.gaveta.on{transform:none;transition:transform .22s var(--ease-out)}
.gaveta .g-cab{padding:18px 20px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.gaveta .g-cab h2{font-family:var(--f-display);font-stretch:80%;font-weight:600;font-size:var(--d-28);line-height:1.05;letter-spacing:-.015em;margin:0}
.gaveta .g-corpo{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:22px}
.gaveta h3{font-size:var(--t-12);color:var(--text-3);font-weight:500;margin:0 0 10px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:9px 12px;margin:0;font-size:var(--t-13)}
.dl dt{color:var(--text-3)}.dl dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.regua-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.regua-g .m{display:flex;flex-direction:column;gap:6px;font-size:var(--t-12);color:var(--text-3)}
.regua-g .m i{height:28px;border-radius:3px;background:var(--border-strong)}
.regua-g .m i.env{background:var(--text-3)}.regua-g .m i.base{background:color-mix(in srgb,var(--text-3) 55%,transparent)}
.regua-g .m i.atual{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent-fg)}.regua-g .m i.prob{background:var(--risk)}
.regua-g .m.agora span{color:var(--accent-fg)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:var(--t-12);color:var(--text-3)}
.legenda span{display:inline-flex;align-items:center;gap:6px}.legenda i{width:3px;height:12px;border-radius:1px;display:inline-block}
.gaveta .g-pe{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.nota{font-size:var(--t-12);color:var(--text-3)}
.so-mob{display:none}
@media (max-width:1400px){.tab .c-adesao{display:none}}
@media (max-width:1100px){.tab .c-paga,.tab .c-num{display:none}}
@media (max-width:760px){
  .titulo{font-size:var(--d-32)}
  .filtros .campo.busca-l{width:100%;margin-left:0;order:-1}
  .seg{overflow-x:auto;max-width:100%}
  .tab thead{display:none}
  .tab,.tab tbody,.tab tr,.tab td{display:block}
  .tab tr{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .tab td{height:auto;padding:0;border:0!important;background:none!important}
  .tab .c-mod,.tab .c-num,.tab .c-adesao,.tab .c-paga{display:none}
  .tab .c-sit{grid-column:2;grid-row:1;justify-self:end}
  .tab .c-regua{grid-column:1/3}
  .tab .cli b{max-width:none}
  .so-mob{display:block;color:var(--text-3);font-size:var(--t-12);margin-top:2px}
  .tab .cli .mono{display:none}
  .gaveta{width:100vw}
}

/* ============================== Guias do mês ============================== */
.gm-cli{border-top:1px solid var(--border)}
.gm-cli:first-child{border-top:0}
.gm-cab{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:12px 16px;background:var(--surface-2)}
.gm-cab b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-cab .t3{font-size:var(--t-12)}
.gm-cab .tot{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:var(--t-13);text-align:right;min-width:96px}
.gm-guia{display:grid;grid-template-columns:18px minmax(0,1.6fr) minmax(0,1fr) 88px 104px auto;gap:12px;align-items:center;min-height:40px;padding:6px 16px 6px 28px;border-top:1px solid var(--border);font-size:var(--t-13)}
.gm-guia:hover{background:var(--hover)}
.gm-guia .i{color:var(--text-3)}
.gm-guia .arq{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-guia .det{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-guia .num{text-align:right}
.gm-guia.falta{color:var(--text-2)}
.gm-guia.falta .arq{color:var(--warn)}
.gm-guia.falta .i{color:var(--warn)}
.gm-guia.rep{opacity:.6}
.gm-guia.rep .arq{text-decoration:line-through;text-decoration-color:var(--text-3)}
.gm-nota{padding:8px 16px 12px 46px;color:var(--text-2);font-size:var(--t-13);border-top:1px solid var(--border)}
.entrada{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;margin-bottom:16px}
.entrada .i{color:var(--warn);margin-top:2px}
.entrada ul{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:var(--t-13)}
@media (max-width:760px){
  .gm-cab{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .gm-cab .tot,.gm-cab .cont{display:none}
  .gm-guia{grid-template-columns:18px minmax(0,1fr) auto;grid-template-areas:"ic arq val" ". mob acao";padding-left:16px;row-gap:2px}
  .gm-guia > .i{grid-area:ic}.gm-guia .arq{grid-area:arq}.gm-guia .num:not(.venc){grid-area:val}.gm-guia .acao{grid-area:acao;justify-self:end}
  .gm-guia .det,.gm-guia .venc{display:none}
  .gm-guia .so-mob{display:block;grid-area:mob;color:var(--text-3);font-size:var(--t-12);align-self:center}
  .gm-guia.falta .acao{grid-area:mob;justify-self:start}
  .gm-nota{padding-left:16px}
}

/* ============================== Envios ============================== */
.env-l{display:grid;grid-template-columns:20px minmax(0,1.5fr) 112px 92px 84px 150px 196px;gap:12px;align-items:center;min-height:52px;padding:8px 16px;border-top:1px solid var(--border);font-size:var(--t-13)}
.env-l .c-guias .venc-sub{display:block;font-size:var(--t-12);color:var(--text-3);font-weight:400;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.env-l .c-guias .falta-sub{display:block;font-size:var(--t-12);color:var(--warn);font-weight:500;margin-top:1px;white-space:nowrap}
.env-l:first-child{border-top:0}
.env-l:hover{background:var(--hover)}
.env-l.sel{background:var(--accent-wash)}
.env-l.cabec{min-height:0;padding:9px 16px;background:var(--surface-2);color:var(--text-3);font-size:var(--t-12);border-top:0;border-radius:var(--r-pan) var(--r-pan) 0 0}
.env-l.cabec:hover{background:var(--surface-2)}
.env-l .quem b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-14)}
.env-l .quem small{display:block;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-l .canal{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);white-space:nowrap}
.env-l .canal .i{width:14px;height:14px}
.env-l .prz.urg{color:var(--warn)}
.env-l .acoes{display:flex;gap:6px;justify-content:flex-end}
.env-l .quando{display:block;color:var(--text-3);font-size:var(--t-12);margin-top:3px}
.convite{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border:1px dashed var(--border-strong);border-radius:var(--r-pan);color:var(--text-2);font-size:var(--t-13)}
.convite .btn{margin-left:auto}
/* prévia do e-mail */
.prev-meta{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:var(--t-13);margin:0}
.prev-meta dt{color:var(--text-3)}.prev-meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.papel{background:#FFFFFF;color:#111;border-radius:8px;border:1px solid var(--border);padding:18px 18px 14px;font:14px/1.5 Aptos,Calibri,Arial,sans-serif}
.papel p{margin:0 0 10px}
.papel table{border-collapse:collapse;font-size:13px;margin:4px 0 12px;width:100%}
.papel th{text-align:left;font-weight:600;padding:5px 8px;border-bottom:2px solid #d1d5db}
.papel td{padding:5px 8px;border-bottom:1px solid #e5e7eb}
.papel td.v,.papel th.v{text-align:right;white-space:nowrap}
.papel .assin{margin-top:12px;padding-top:10px;border-top:1px solid #eee;display:flex;gap:12px;align-items:center}
.papel .assin .logo{width:42px;height:42px;border-radius:6px;background:#1f2328;color:#c9a46a;display:grid;place-items:center;font-weight:700;font-size:13px}
.papel .assin b{display:block;font-size:14px}.papel .assin span{color:#6b7280;font-size:12px}
.anexos{display:flex;flex-direction:column;gap:6px}
.anexo{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-ctl);font-size:var(--t-13)}
.anexo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anexo small{margin-left:auto;color:var(--text-3);white-space:nowrap}
.msg-wpp{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pan);padding:12px 14px;font-size:var(--t-13);line-height:1.5}
@media (max-width:1100px){.env-l{grid-template-columns:20px minmax(0,1fr) 92px 150px 180px}.env-l .c-guias,.env-l .c-prazo{display:none}}
@media (max-width:760px){
  .env-l{grid-template-columns:20px minmax(0,1fr) auto;grid-template-areas:"cb quem sit" ". info info" ". acoes acoes";row-gap:6px;padding:12px 14px}
  .env-l.cabec{display:none}
  .env-l .cbx{grid-area:cb;align-self:start;margin-top:3px}.env-l .quem{grid-area:quem}.env-l .c-sit{grid-area:sit;justify-self:end;align-self:start}
  .env-l .c-canal{grid-area:info}.env-l .acoes{grid-area:acoes;justify-content:flex-start}
  .convite{flex-wrap:wrap}.convite .btn{margin-left:0}

/* ============================== Rodadas, Clientes, Configurações ============================== */
.rod-l{display:grid;grid-template-columns:150px 96px 90px 90px 80px minmax(0,1fr);gap:12px;align-items:center;min-height:44px;padding:8px 16px;border-top:1px solid var(--border);font-size:var(--t-13)}
.rod-l.cabec{min-height:0;padding:9px 16px;background:var(--surface-2);color:var(--text-3);font-size:var(--t-12);border-top:0;border-radius:var(--r-pan) var(--r-pan) 0 0}
.rod-l .res{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rod-l .res.err{color:var(--risk)}
.rodar{padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.rodar .linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.escolha{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-ctl);padding:6px}
.escolha label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;font-size:var(--t-13);cursor:pointer}
.escolha label:hover{background:var(--hover)}
.radio{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-13);cursor:pointer}
.cli-l{display:grid;grid-template-columns:minmax(0,1.6fr) 120px minmax(0,1.2fr) 110px minmax(0,1fr);gap:12px;align-items:center;min-height:48px;padding:8px 16px;border-top:1px solid var(--border);font-size:var(--t-13);cursor:pointer}
.cli-l:hover{background:var(--hover)}
.cli-l.cabec{min-height:0;padding:9px 16px;background:var(--surface-2);color:var(--text-3);font-size:var(--t-12);border-top:0;cursor:default;border-radius:var(--r-pan) var(--r-pan) 0 0}
.cli-l b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-l small{display:block;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marcas-c{display:flex;gap:4px;flex-wrap:wrap}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.cfg .pnl{padding:16px}
.cfg h2{font-size:var(--t-14);font-weight:600;margin:0 0 4px}
.cfg p.d{color:var(--text-2);font-size:var(--t-13);margin:0 0 12px}
.campos{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:var(--t-13)}
.campos label{color:var(--text-2)}
.campos select,.campos input{height:32px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-1);padding:0 8px;font-size:var(--t-13);min-width:0}
.campos select option{background:var(--surface);color:var(--text-1)}
.cfg .acoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.selos-int{display:flex;flex-direction:column;gap:8px}
.selo-int{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-pan);font-size:var(--t-13)}
.selo-int .ico-c{width:28px;height:28px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2)}
.selo-int small{display:block;color:var(--text-3);font-size:var(--t-12)}
.menu-comp{position:absolute;top:44px;z-index:30;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-pan);box-shadow:var(--shadow-pop);padding:4px;min-width:180px}
.menu-comp button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-1);padding:7px 10px;border-radius:var(--r-ctl);cursor:pointer;font-size:var(--t-13)}
.menu-comp button:hover,.menu-comp button[aria-current="true"]{background:var(--surface-2)}
.mais-l{display:flex;flex-direction:column;gap:8px;max-width:420px}
.mais-l .nav{height:44px;border:1px solid var(--border);background:var(--surface)}
@media (max-width:1000px){.rod-l{grid-template-columns:120px 80px 70px minmax(0,1fr)}.rod-l .c-cons,.rod-l .c-guias{display:none}.cli-l{grid-template-columns:minmax(0,1fr) 110px 110px}.cli-l .c-dest,.cli-l .c-marc{display:none}}
@media (max-width:760px){.rod-l{grid-template-columns:1fr auto;row-gap:2px}.rod-l.cabec{display:none}.rod-l .c-tipo,.rod-l .c-cli{display:none}.rod-l .res{grid-column:1/3}.cli-l{grid-template-columns:minmax(0,1fr) auto}.cli-l.cabec{display:none}.cli-l .c-par{display:none}.cfg{grid-template-columns:1fr}}

/* anexar guias */
.anexar{padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:1.5px dashed var(--border-strong);border-radius:var(--r-pan);color:var(--text-2);font-size:var(--t-13);cursor:pointer;text-align:center;padding:16px;transition:border-color .12s,background .12s}
.drop b{color:var(--text-1);font-weight:600;font-size:var(--t-14)}
.drop .i{width:22px;height:22px;color:var(--text-3)}
.drop:hover,.drop.sobre{border-color:var(--accent-fg);background:var(--accent-wash)}
.drop input{display:none}
.up-l{display:flex;flex-direction:column}
.up{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--border);font-size:var(--t-13)}
.up:first-child{border-top:0}
.up .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up small{display:block;color:var(--text-3)}
.up .ok{color:var(--ok)}.up .nao{color:var(--warn)}.up .err{color:var(--risk)}.up .rep{color:var(--text-3)}
.up-mon{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-top:4px;border-radius:var(--r-pan);background:var(--surface-2);border:1px solid var(--border);font-size:var(--t-13)}
.up-mon .mon-l{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mon{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--r-pill);font-size:var(--t-12);font-weight:500}
.mon.ok{background:var(--ok-wash);color:var(--ok)}.mon.rep{background:var(--hover);color:var(--text-2)}.mon.nao{background:var(--warn-wash,color-mix(in srgb,var(--warn) 16%,transparent));color:var(--warn)}.mon.erro{background:color-mix(in srgb,var(--risk) 14%,transparent);color:var(--risk)}
.up .gira{width:14px;height:14px;border:1.5px solid var(--text-3);border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}

/* formularios de edicao */
.form-q{display:flex;flex-direction:column;gap:12px}
.form-q .cp{display:flex;flex-direction:column;gap:5px;font-size:var(--t-13)}
.form-q .cp > span{color:var(--text-2)}
.form-q .cp small{color:var(--text-3);font-size:var(--t-12)}
.form-q input,.form-q select{height:34px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-1);padding:0 10px;font-size:var(--t-14);min-width:0;width:100%}
.form-q input:focus,.form-q select:focus{outline:none;border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--accent-wash)}
.form-q select option{background:var(--surface);color:var(--text-1)}
.form-q .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* planilha: grade editável */
.pl-filtros .campo select{max-width:220px}
.pl-wrap{position:relative}
.pl-grade{overflow:auto;max-height:calc(100vh - 290px);min-height:240px;border-radius:var(--r-pan) var(--r-pan) 0 0}
.pl-tab{min-width:100%;width:max-content}
.pl-tab thead th{top:0;z-index:3}
.pl-tab td{height:40px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.pl-tab tbody tr{cursor:default}
.pl-tab tbody tr:hover td{background:color-mix(in srgb,var(--surface) 96%,var(--text-1))}
.pl-tab tbody tr[aria-selected="true"] td{background:color-mix(in srgb,var(--surface) 88%,var(--accent-fill))}
.pl-tab .pl-cb{position:sticky;left:0;z-index:2;width:36px;min-width:36px;padding:0 0 0 12px}
.pl-tab thead .pl-cb{z-index:4}
.pl-tab .pl-emp{position:sticky;left:36px;z-index:2;min-width:220px;max-width:260px;box-shadow:1px 0 0 var(--border)}
.pl-tab thead .pl-emp{z-index:4}
.pl-tab .pl-emp b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.pl-tab .pl-emp .mono{display:block;color:var(--text-3);font-size:11px;margin-top:1px}
.pl-tab .pl-obs{min-width:180px;max-width:320px}
.pl-tab .pl-mail{max-width:240px}
.pl-tab th.pl-mes,.pl-tab td.pl-mes{min-width:92px;text-align:left}
.pl-tab th.pl-mes.atual{color:var(--accent-fg)}
.pl-tab td.pl-mes.atual{box-shadow:inset 1px 0 0 var(--border),inset -1px 0 0 var(--border)}
.pl-tab .pl-tipo b{font-weight:500}
.pl-tab .vz{color:var(--text-3)}
.pl-tab td.ed{cursor:text;position:relative}
.pl-tab td.ed.pl-emp{position:sticky}
.pl-tab .canal{display:inline-flex;align-items:center;gap:6px}.pl-tab .canal .i{width:14px;height:14px;color:var(--text-3)}
.pl-tab .paga{display:inline-flex;align-items:center;gap:6px}.pl-tab .paga .i{width:14px;height:14px}
.pl-tab td.ed:hover{box-shadow:inset 0 0 0 1px var(--border-strong)}
.pl-tab td.ed:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-fg)}
.pl-tab td.ed.editando{padding:0 4px;overflow:visible;box-shadow:inset 0 0 0 2px var(--accent-fg);z-index:1}
.pl-ed input,.pl-ed select{width:100%;min-width:150px;height:32px;border:0;border-radius:4px;background:var(--surface-2);color:var(--text-1);padding:0 8px;font:inherit;font-size:var(--t-13);outline:none}
.pl-ed select option{background:var(--surface);color:var(--text-1)}
.pl-tab td.ed.salvando::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent-fg);animation:pulsa 1s ease-in-out infinite}
.pl-tab td.ed.salvo{animation:salvo 1.4s ease-out}
.pl-tab td.ed.erro{box-shadow:inset 0 0 0 2px var(--risk)}
@keyframes salvo{0%{background:var(--ok-wash)}100%{background:var(--surface)}}
@keyframes pulsa{50%{opacity:.25}}
.pl-tab .selo{height:20px;font-size:11px}
.pl-lote{position:fixed;left:calc(50% + var(--side) / 2);transform:translateX(-50%);bottom:20px;z-index:20;display:none;max-width:calc(100vw - var(--side) - 32px);align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-radius:var(--r-pan);background:var(--surface-2);border:1px solid var(--border-strong);box-shadow:var(--shadow-pop);font-size:var(--t-13)}
.pl-lote:not(:empty){display:flex}
.pl-lote .campo select{max-width:140px}
@media (min-width:900px){.pl-lote{flex-wrap:nowrap;white-space:nowrap}}
.pl-lote > span:first-child{margin-right:4px}
.campo.p{height:28px}.campo.p select{height:26px;font-size:var(--t-12)}
.btn.perigo{background:var(--risk);border-color:transparent;color:#fff}
.btn.perigo:hover{filter:brightness(1.08)}
.selo.vivo::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulsa 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.selo.vivo::before,.pl-tab td.ed.salvando::after,.pl-tab td.ed.salvo{animation:none}}
@media (max-width:640px){
  .tab.pl-tab thead{display:table-header-group}
  .tab.pl-tab{display:table}.tab.pl-tab tbody{display:table-row-group}
  .tab.pl-tab tr{display:table-row!important;padding:0;border:0}
  .tab.pl-tab td,.tab.pl-tab th{display:table-cell}
  .tab.pl-tab td{height:40px;padding:0 12px;border-bottom:1px solid var(--border)!important;background:var(--surface)!important}
  .tab.pl-tab td.ed.editando{padding:0 4px}
  .tab.pl-tab tbody tr[aria-selected="true"] td{background:color-mix(in srgb,var(--surface) 88%,var(--accent-fill))!important}
  .tab.pl-tab .cli .mono,.pl-tab .pl-emp .mono{display:block}
  .pl-lote{left:12px!important;right:12px;transform:none;max-width:none}
}
@media (max-width:640px){.pl-grade{max-height:calc(100vh - 330px)}.pl-tab .pl-emp{min-width:150px;max-width:170px}.pl-filtros .campo select{max-width:160px}.pl-lote{bottom:76px}}
/* exportar */
.gaveta.larga{width:min(560px,100vw)}
.exp-mods{display:flex;flex-wrap:wrap;gap:6px}
.chip-mod{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-size:var(--t-12);cursor:pointer}
.chip-mod:hover{color:var(--text-1)}
.chip-mod[aria-pressed="true"]{background:var(--accent-wash);border-color:transparent;color:var(--accent-fg)}
.chip-mod .x{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:-4px}
.chip-mod .x:hover{background:var(--hover)}.chip-mod .x .i{width:12px;height:12px}
.exp-ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.exp-ck label{display:flex;align-items:center;gap:8px;min-height:30px;font-size:var(--t-13);cursor:pointer}
.exp-ck label .num{margin-left:auto;font-size:var(--t-12)}
/* site proprio: entrada */
body.sem-sessao .app,body.sem-sessao .barra-inferior,body.sem-sessao .lote{display:none}
.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--canvas);z-index:60}
.login .cx{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pan);padding:28px 24px 22px}
.login .marca{padding:0;margin-bottom:22px}
.login h1{font-family:var(--f-display);font-stretch:85%;font-weight:620;font-size:var(--d-28);letter-spacing:-.02em;margin:0 0 4px}
.login .t2{margin:0 0 18px;font-size:var(--t-14)}
.login .msg{min-height:18px;margin:2px 0 0;color:var(--risk);font-size:var(--t-13)}
.login .msg.ok{color:var(--ok)}
.login .btn.pri{width:100%;justify-content:center;height:36px}
.login .lnk{background:none;border:0;color:var(--text-2);font-size:var(--t-13);cursor:pointer;padding:4px 0;align-self:center}
.login .lnk:hover{color:var(--text-1)}
.login .lnk:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:4px}
.chip-atual{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 4px;color:var(--text-3);font-size:var(--t-12);white-space:nowrap}
@media (max-width:640px){.chip-atual .txt{display:none}}
.form-q .erro-f{color:var(--risk);font-size:var(--t-13)}
.cli-parcs{display:flex;flex-direction:column}
.cli-parcs button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:0;border-top:1px solid var(--border);background:none;color:var(--text-1);padding:9px 2px;cursor:pointer;font-size:var(--t-13)}
.cli-parcs button:first-child{border-top:0}
.cli-parcs button:hover{background:var(--hover)}
.cli-parcs small{color:var(--text-3);grid-column:1/2}
@media (max-width:760px){.form-q .dupla{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lateral" id="lateral" aria-label="Navegação"></aside>
  <div class="principal">
    <header class="topo" id="topo"></header>
    <div id="faixa"></div>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>
</div>
<nav class="barra-inferior" id="inferior" aria-label="Navegação"></nav>
